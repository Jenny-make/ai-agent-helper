server:
  port: 8080

spring:
  application:
    name: spring-ai-feishu-cs-starter

  ai:
    deepseek:
      base-url: ${SPRING_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${SPRING_AI_DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_DEEPSEEK_CHAT_MODEL:deepseek-chat}
          temperature: 0.2
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:qwen-max}
          temperature: 0.2
    minimax:
      base-url: ${SPRING_AI_MINIMAX_BASE_URL:https://api.minimax.chat}
      api-key: ${SPRING_AI_MINIMAX_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_MINIMAX_CHAT_OPTIONS_MODEL:abab6.5g-chat}
          temperature: 0.2
    vectorstore:
      milvus:
        client:
          host: ${SPRING_AI_VECTORSTORE_MILVUS_CLIENT_HOST:127.0.0.1}
          port: ${SPRING_AI_VECTORSTORE_MILVUS_CLIENT_PORT:19530}
          username: ${SPRING_AI_VECTORSTORE_MILVUS_USERNAME:}
          password: ${SPRING_AI_VECTORSTORE_MILVUS_PASSWORD:}
          database-name: ${SPRING_AI_VECTORSTORE_MILVUS_DATABASE_NAME:default}
        collection-name: ${SPRING_AI_VECTORSTORE_MILVUS_COLLECTION_NAME:customer_service_knowledge}
        initialize-schema: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.example.customerservice.service.KnowledgeAnswerService: ${APP_KNOWLEDGE_ANSWER_LOG_LEVEL:INFO}

app:
  console:
    enabled: ${APP_CONSOLE_ENABLED:false}
  ai:
    provider: ${APP_AI_PROVIDER:auto}
    system-prompt: ${APP_SYSTEM_PROMPT:You are a helpful customer support assistant. Answer clearly and concisely.}
  memory:
    enabled: ${APP_MEMORY_ENABLED:true}
    max-turns: ${APP_MEMORY_MAX_TURNS:6}
    max-chars-per-message: ${APP_MEMORY_MAX_CHARS_PER_MESSAGE:1200}
    prompt-recent-turns: ${APP_MEMORY_PROMPT_RECENT_TURNS:4}
    max-summary-chars: ${APP_MEMORY_MAX_SUMMARY_CHARS:1200}
  rag:
    enabled: ${APP_RAG_ENABLED:false}
    top-k: ${APP_RAG_TOP_K:4}
    similarity-threshold: ${APP_RAG_SIMILARITY_THRESHOLD:0.0}
    max-chars-per-doc: ${APP_RAG_MAX_CHARS_PER_DOC:1200}
  feishu:
    base-url: ${APP_FEISHU_BASE_URL:https://open.feishu.cn/open-apis}
    verification-token: ${APP_FEISHU_VERIFICATION_TOKEN:}
    encrypt-key: ${APP_FEISHU_ENCRYPT_KEY:}
    knowledge:
      enabled: ${APP_FEISHU_KNOWLEDGE_ENABLED:false}
      auto-sync-on-startup: ${APP_FEISHU_KNOWLEDGE_AUTO_SYNC_ON_STARTUP:false}
      chunk-size: ${APP_FEISHU_KNOWLEDGE_CHUNK_SIZE:700}
      chunk-overlap: ${APP_FEISHU_KNOWLEDGE_CHUNK_OVERLAP:120}
      max-chunks-per-document: ${APP_FEISHU_KNOWLEDGE_MAX_CHUNKS_PER_DOCUMENT:200}
      state-file: ${APP_FEISHU_KNOWLEDGE_STATE_FILE:build/feishu-knowledge/sync-state.json}
      sources: []
    bot:
      app-id: ${APP_FEISHU_BOT_APP_ID:}
      app-secret: ${APP_FEISHU_BOT_APP_SECRET:}
